build: "20261007-1333"
version: "Pre-Alpha"
date: "2026-10-07"
name: "Pre-Alpha 2026-10-07 (build 20261007-1333)"
title: "MaSzyna Reloaded Exe Pre-Alpha 2026-10-07 (build 20261007-1333)"
summary: "Wczesna, niekompletna wersja demonstracyjna. Nie jest pełnoprawnym zamiennikiem klasycznej MaSzyny i zawiera znane błędy."
description: "Wydanie demonstracyjne dla systemów Windows 64-bit i Linux 64-bit."

downloads:
  - id: "windows"
    label: "Windows 64-bit"
    format: "Instalator EXE"
    url: "https://drive.usercontent.google.com/download?id=1fR9BqgCP3Elf-kJzPI0fqnPeHtOHFVHi&export=download&confirm=t"
  - id: "linux"
    label: "Linux 64-bit"
    format: "Archiwum ZIP"
    url: "https://drive.usercontent.google.com/download?id=1VQkZfEUb9lN9NO1ATWFCtulzrNilHkLD&export=download&confirm=t"

installation:
  warning_title: "Potrzebna jest oryginalna MaSzyna"
  warning: "MaSzyna Reloaded korzysta z danych oryginalnej gry."
  warning_detail: "Program spróbuje znaleźć jej katalog automatycznie. Jeśli się nie uda, poprosi o jego wskazanie."
  heading: "Windows lub Linux"
  short: "Windows: uruchom instalator EXE. Linux: rozpakuj cały ZIP. Program sam poszuka katalogu oryginalnej MaSzyny."
  steps:
    - title: "Windows — uruchom instalator EXE"
      description: "Pobierz instalator, uruchom go i zainstaluj MaSzynę Reloaded."
    - title: "Linux — rozpakuj cały ZIP"
      description: "Uruchom plik reloaded. Archiwum możesz rozpakować także do katalogu oryginalnej MaSzyny."
    - title: "Nie znaleziono gry? Wskaż katalog"
      description: "Wybierz katalog z zainstalowaną oryginalną MaSzyną w oknie programu."

changes:
  - "Dodano ustawienia obrazu, grafiki i katalogu MaSzyny"
  - "Dodano edycję składu i przeglądarkę pojazdów"
  - "Dodano podpowiedzi maszynisty pod F3"
  - "Dodano nowe sterowanie drzwiami, pantografami i wyposażeniem kabiny"
  - "Dodano powrót na fotel maszynisty pod Ctrl + PPM"
  - "Poprawiono zmianę kabiny i przechodzenie między pojazdami"
  - "Poprawiono uruchamianie, hamulce i prowadzenie EN57, SN61 i 36WE"
  - "Poprawiono działanie AI, sygnałów i obsługi drzwi"
  - "Przyspieszono ładowanie scenerii, pojazdów i kabin"
  - "Poprawiono ekran ładowania i postęp uruchamiania scenariusza"
  - "Dodano podgląd zadania, postępu scenariusza i rozkładu jazdy"
  - "Dodano kartę pojazdu pod F7 i listę składów pod Shift + F7"
  - "Dodano prędkość symulacji x30"
  - "Dodano logi rozgrywki i formularz zgłaszania błędów"
  - "Poprawiono szyby, modele pojazdów i wygląd składów"
  - "Naprawiono awarie ładowania i renderowania na Windowsie"
  - "Dodano instalator Windows"

limitations:
  - text: "Lustra zewnętrzne pozostają funkcją w trakcie prac (W.I.P.)."
  - text: "Możliwe są błędy w zachowaniu pojazdów."
  - text: "Możliwe błędy zachowania AI i przebiegu scenariuszy."
  - text: "Dźwięk może być niekompletny i miejscami wadliwy."


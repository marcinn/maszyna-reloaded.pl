      description: "Prowadzenie, hamulce i wyposażenie pojazdu"
      sections:
        - title: "Prowadzenie i hamulce"
          bindings:
            - keys: ["Num +"]
              action: "Zwiększenie pozycji nastawnika głównego"
            - keys: ["Num −"]
              action: "Zmniejszenie pozycji nastawnika głównego"
            - keys: ["Num /"]
              action: "Zwiększenie pozycji nastawnika dodatkowego"
            - keys: ["Num *"]
              action: "Zmniejszenie pozycji nastawnika dodatkowego"
            - keys: ["D"]
              action: "Zwiększenie pozycji kierunku jazdy"
            - keys: ["R"]
              action: "Zmniejszenie pozycji kierunku jazdy"
            - keys: ["Num 9"]
              action: "Zwiększenie pozycji kranu hamulca zespolonego"
            - keys: ["Num 3"]
              action: "Zmniejszenie pozycji kranu hamulca zespolonego"
